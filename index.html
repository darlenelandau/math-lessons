<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайна сундука пирата — Комбинаторика</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#0c1445 0%,#1a237e 30%,#0d47a1 60%,#01579b 100%);color:#e2e8f0;min-height:100vh}
        .container{max-width:850px;margin:0 auto;padding:16px}

        h1{text-align:center;font-size:2em;margin:18px 0 4px;background:linear-gradient(90deg,#ffd54f,#ffb300,#ffd54f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .sub{text-align:center;color:#90caf9;margin-bottom:20px;font-size:1.05em}

        /* progress */
        .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
        .badge{background:rgba(255,255,255,.1);border-radius:24px;padding:6px 18px;font-weight:700;font-size:1em;border:2px solid}
        .badge.gold{color:#ffd54f;border-color:#ffd54f}
        .badge.blue{color:#90caf9;border-color:#64b5f6}
        .pbar{width:100%;background:rgba(255,255,255,.1);border-radius:12px;height:16px;overflow:hidden;margin-bottom:18px}
        .pfill{height:100%;background:linear-gradient(90deg,#ffd54f,#ffb300);border-radius:12px;transition:width .6s}

        /* code display */
        .code-row{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
        .code-digit{width:44px;height:52px;background:rgba(0,0,0,.4);border:2px solid #546e7a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:800;color:#ffd54f;font-family:monospace}
        .code-digit.found{border-color:#ffd54f;background:rgba(255,193,7,.15)}

        /* card */
        .card{background:rgba(13,71,161,.5);border:2px solid rgba(144,202,249,.2);border-radius:18px;padding:26px 28px;margin-bottom:22px;backdrop-filter:blur(8px);display:none}
        .card.active{display:block;animation:fadeUp .4s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .card h2{color:#ffd54f;font-size:1.3em;margin-bottom:12px;display:flex;align-items:center;gap:10px}
        .card p,.card li{font-size:1.05em;color:#bbdefb;margin-bottom:6px}
        .card ul{padding-left:20px;margin:6px 0 12px}
        .card .hl{color:#ffd54f;font-weight:700}

        .emoji-big{text-align:center;font-size:2.8em;margin:10px 0}

        .theory{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:16px 20px;margin:14px 0;color:#e3f2fd}
        .theory strong{color:#ffd54f}

        /* task */
        .taskbox{background:rgba(0,0,0,.25);border:2px solid #5c6bc0;border-radius:14px;padding:16px 20px;margin:14px 0}
        .taskbox h3{color:#b39ddb;margin-bottom:8px;font-size:1.05em}
        .subtask{margin:12px 0;padding:10px 14px;background:rgba(255,255,255,.04);border-radius:10px;border-left:3px solid #7c4dff}
        .subtask p{margin-bottom:6px}

        /* hint */
        .hint-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.3);border-radius:8px;padding:7px 16px;cursor:pointer;color:#ffd54f;font-size:.93em;margin:6px 0;transition:background .2s}
        .hint-btn:hover{background:rgba(255,193,7,.22)}
        .hint-body{background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.2);border-radius:8px;padding:12px 16px;margin:0 0 8px;color:#fff9c4;font-size:.93em;display:none}
        .hint-body.show{display:block;animation:fadeUp .25s ease}

        /* input */
        .inp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
        .inp-row label{color:#90caf9}
        .inp-row input{background:rgba(0,0,0,.3);border:2px solid #546e7a;border-radius:8px;padding:8px 12px;font-size:1.15em;color:#fff;width:100px;text-align:center}
        .inp-row input:focus{outline:none;border-color:#ffd54f}
        .go{background:linear-gradient(135deg,#7c4dff,#651fff);border:none;border-radius:8px;padding:8px 22px;color:#fff;font-size:1em;font-weight:600;cursor:pointer}
        .go:hover{opacity:.9}
        .go:disabled{opacity:.4;cursor:default}

        /* feedback */
        .fb{padding:10px 14px;border-radius:8px;margin:8px 0;font-weight:600;display:none}
        .fb.show{display:block;animation:fadeUp .25s ease}
        .fb.ok{background:rgba(76,175,80,.2);border:1px solid #66bb6a;color:#a5d6a7}
        .fb.no{background:rgba(255,183,77,.15);border:1px solid #ffb74d;color:#ffe0b2}
        .fb.half{background:rgba(100,181,246,.15);border:1px solid #64b5f6;color:#bbdefb}

        .expl{background:rgba(123,31,162,.15);border:1px solid rgba(186,104,200,.3);border-radius:10px;padding:14px 18px;margin:10px 0;color:#e1bee7;display:none;line-height:1.7}
        .expl.show{display:block;animation:fadeUp .25s ease}

        .nxt{display:none;background:linear-gradient(135deg,#ffb300,#ff8f00);border:none;border-radius:10px;padding:12px 28px;color:#1a1a2e;font-size:1.1em;font-weight:700;cursor:pointer;margin-top:12px}
        .nxt.show{display:inline-block}
        .nxt:hover{opacity:.9}

        /* finale */
        .finale{text-align:center;padding:30px 10px}
        .finale h2{color:#ffd54f;font-size:1.8em;margin-bottom:10px}
        .finale .big{font-size:3.5em;margin:14px 0}
        .finale .sc{font-size:2.3em;font-weight:800;color:#ffd54f}
        .finale p{color:#90caf9;font-size:1.1em;margin:6px 0}
        .again{background:linear-gradient(135deg,#7c4dff,#651fff);border:none;border-radius:12px;padding:14px 36px;color:#fff;font-size:1.15em;font-weight:700;cursor:pointer;margin-top:18px}

        @media(max-width:500px){h1{font-size:1.4em}.card{padding:18px 16px}.code-digit{width:36px;height:44px;font-size:1.2em}}
    </style>
</head>
<body>
<div class="container">
    <h1>Тайна сундука пирата</h1>
    <p class="sub">Реши 5 испытаний и собери код от сундука!</p>

    <div class="top">
        <div class="badge gold" id="scB">Монеты: 0</div>
        <div class="badge blue" id="lvB">Испытание 1 / 5</div>
    </div>
    <div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>

    <div class="code-row" id="codeRow"></div>

    <div id="area"></div>
</div>

<script>
let score=0, cur=0, att={};
const TOTAL=5;
const CODE=[6,9,1,9,7]; // будут подставлены из ответов
const PTS1=10, PTS2=5;

// ===== LEVEL DATA =====
// Каждый уровень: несколько подзадач, последний ответ = цифра кода
const levels=[
// --- ИСПЫТАНИЕ 1: Флаги ---
{
    title:'Флаги на мачте',
    emoji:'🏴‍☠️',
    intro:'У пирата Барбароссы <span class="hl">5 разных флагов</span>. Сигнал — это 3 флага, вывешенных на мачте в ряд (порядок важен!).',
    theory:'<strong>Правило:</strong> когда выбираем по одному предмету на каждое место и порядок важен, перемножаем число вариантов для каждого места.',
    subs:[
        {q:'Сколько вариантов для первого флага?', ans:5, hint:'Из 5 флагов выбираем любой.'},
        {q:'Сколько вариантов для второго флага (один уже использован)?', ans:4, hint:'Один флаг уже на мачте, осталось 4.'},
        {q:'Сколько всего разных сигналов из 3 флагов? (5 × 4 × ...)', ans:60, hint:'5 × 4 × 3 = ?'}
    ],
    codeDigit:6, // 60 → первая цифра = 6
    codeExpl:'Ответ: 60. Первая цифра кода: <span class="hl">6</span>',
    fullExpl:'На 1-е место — 5 вариантов, на 2-е — 4 (один флаг занят), на 3-е — 3.<br>5 × 4 × 3 = <strong>60 сигналов</strong>.'
},
// --- ИСПЫТАНИЕ 2: Трёхзначные числа ---
{
    title:'Пиратский шифр',
    emoji:'🔢',
    intro:'Барбаросса шифрует послания трёхзначными числами.',
    theory:'<strong>Помни:</strong> первая цифра трёхзначного числа — от 1 до 9 (не может быть 0!). Остальные — от 0 до 9.',
    subs:[
        {q:'Сколько всего существует трёхзначных чисел? (от 100 до 999)', ans:900, hint:'Первая цифра: 9 вариантов (1–9), вторая: 10 (0–9), третья: 10. Перемножь.'},
        {q:'Сколько трёхзначных чисел, у которых ВСЕ цифры нечётные? (1,3,5,7,9)', ans:125, hint:'На каждое из 3 мест — 5 нечётных цифр: 5 × 5 × 5.'},
        {q:'Сколько трёхзначных чисел, у которых все три цифры различны?', ans:648, hint:'Первая: 9 вариантов (1–9). Вторая: 9 (0–9, кроме первой). Третья: 8.'}
    ],
    codeDigit:9,
    codeExpl:'Последний ответ: 648. Но цифра кода — сумма его цифр: 6+4+8=18, 1+8=<span class="hl">9</span>',
    fullExpl:'а) 9 × 10 × 10 = <strong>900</strong><br>б) 5 × 5 × 5 = <strong>125</strong><br>в) 9 × 9 × 8 = <strong>648</strong> (первая ≠ 0, вторая ≠ первой, третья ≠ первым двум).'
},
// --- ИСПЫТАНИЕ 3: Монетка ---
{
    title:'Бросок монетки',
    emoji:'🪙',
    intro:'Пират бросает монетку <span class="hl">4 раза</span> и записывает результат: О (орёл) или Р (решка).',
    theory:'<strong>Правило:</strong> если на каждом шаге 2 варианта и шагов <em>n</em>, то всего вариантов 2 × 2 × ... (n раз) = 2<sup>n</sup>.',
    subs:[
        {q:'Сколько всего разных записей может получиться?', ans:16, hint:'2 × 2 × 2 × 2 = 2⁴ = ?'},
        {q:'Сколько записей содержат ровно ОДИН орёл? (Перечисли!)', ans:4, hint:'Орёл может быть на 1-м, 2-м, 3-м или 4-м месте. Сколько это?'},
        {q:'А сколько записей содержат хотя бы один орёл? (Подсказка: проще от обратного!)', ans:15, hint:'Всего 16 записей. Из них РРРР — ноль орлов. Остальные — хотя бы один: 16 − 1 = ?'}
    ],
    codeDigit:1,
    codeExpl:'Разность: 16 − 15 = <span class="hl">1</span> — это третья цифра кода.',
    fullExpl:'а) 2⁴ = <strong>16</strong><br>б) ОРРР, РОРР, РРОО, РРРO → <strong>4 записи</strong><br>в) Без орла: только РРРР (1 вариант). С орлом: 16 − 1 = <strong>15</strong>.'
},
// --- ИСПЫТАНИЕ 4: Палиндромы ---
{
    title:'Зеркальные числа',
    emoji:'🪞',
    intro:'Палиндром — число, которое одинаково читается слева направо и справа налево. Например: <span class="hl">1221</span>, <span class="hl">5005</span>, <span class="hl">7777</span>.',
    theory:'<strong>Ключ:</strong> в четырёхзначном палиндроме <em>abba</em> первая цифра = последней, вторая = третьей. Достаточно выбрать только первые две цифры!',
    subs:[
        {q:'Сколько вариантов для первой цифры палиндрома? (Помни: число четырёхзначное!)', ans:9, hint:'Первая цифра — от 1 до 9 (не 0, иначе не четырёхзначное).'},
        {q:'Сколько вариантов для второй цифры?', ans:10, hint:'Вторая цифра — любая от 0 до 9.'},
        {q:'Сколько всего четырёхзначных палиндромов?', ans:90, hint:'9 × 10 = ?'}
    ],
    codeDigit:9,
    codeExpl:'Ответ: 90. Сумма цифр: 9+0 = <span class="hl">9</span> — четвёртая цифра кода.',
    fullExpl:'Палиндром abba: a — 9 вариантов (1–9), b — 10 вариантов (0–9), c и d определены.<br>9 × 10 = <strong>90 палиндромов</strong>.'
},
// --- ИСПЫТАНИЕ 5: Слово КОМПАС ---
{
    title:'Тайное слово',
    emoji:'🧭',
    intro:'Из букв слова <span class="hl">КОМПАС</span> (6 разных букв) составляют «слова» — перестановки всех 6 букв.',
    theory:'<strong>Перестановки:</strong> число способов расставить <em>n</em> разных предметов в ряд = n! = n × (n−1) × ... × 2 × 1.',
    subs:[
        {q:'Сколько всего «слов» из 6 букв? (6! = 6 × 5 × 4 × 3 × 2 × 1)', ans:720, hint:'6 × 5 = 30, × 4 = 120, × 3 = 360, × 2 = 720.'},
        {q:'Сколько из них начинаются на букву К?', ans:120, hint:'К уже на месте. Остальные 5 букв — перестановки: 5! = ?'},
        {q:'Сколько «слов» начинаются на гласную? (В слове КОМПАС гласные: О и А)', ans:240, hint:'Начинается на О: 5! = 120. На А: тоже 120. Всего?'}
    ],
    codeDigit:7,
    codeExpl:'Сумма цифр ответа: 2+4+0 = 6. Но цифра кода = 6+1 = <span class="hl">7</span>!',
    fullExpl:'а) 6! = <strong>720</strong><br>б) Фиксируем К на 1-м месте, остальные 5 букв: 5! = <strong>120</strong><br>в) Гласные О и А: 2 × 5! = 2 × 120 = <strong>240</strong>.'
}
];

// ===== CODE DISPLAY =====
function initCode(){
    const row=document.getElementById('codeRow');
    row.innerHTML='';
    for(let i=0;i<TOTAL;i++){
        const d=document.createElement('div');
        d.className='code-digit';
        d.id='cd'+i;
        d.textContent='?';
        row.appendChild(d);
    }
}

function revealCode(idx,digit){
    const d=document.getElementById('cd'+idx);
    d.textContent=digit;
    d.classList.add('found');
}

// ===== RENDER =====
function render(){
    if(cur>=TOTAL){finale();return;}
    const lv=levels[cur];
    att[cur]={};
    for(let i=0;i<lv.subs.length;i++) att[cur][i]=0;

    document.getElementById('lvB').textContent=`Испытание ${cur+1} / ${TOTAL}`;
    document.getElementById('pf').style.width=`${cur/TOTAL*100}%`;

    let h=`<div class="card active" id="lv${cur}">`;
    h+=`<div class="emoji-big">${lv.emoji}</div>`;
    h+=`<h2>Испытание ${cur+1}: ${lv.title}</h2>`;
    h+=`<p>${lv.intro}</p>`;
    h+=`<div class="theory">${lv.theory}</div>`;
    h+=`<div class="taskbox"><h3>Задания</h3>`;

    lv.subs.forEach((s,i)=>{
        h+=`<div class="subtask" id="sub${cur}_${i}">`;
        h+=`<p><strong>${String.fromCharCode(1072+i)})</strong> ${s.q}</p>`;
        h+=`<div class="hint-btn" onclick="togH('hh${cur}_${i}')">💡 Подсказка</div>`;
        h+=`<div class="hint-body" id="hh${cur}_${i}">${s.hint}</div>`;
        h+=`<div class="inp-row"><label>Ответ:</label><input type="number" id="in${cur}_${i}" placeholder="?"><button class="go" id="go${cur}_${i}" onclick="chk(${cur},${i})">Ок</button></div>`;
        h+=`<div class="fb" id="fb${cur}_${i}"></div>`;
        h+=`</div>`;
    });

    h+=`</div>`; // taskbox
    h+=`<div class="expl" id="expl${cur}">${lv.fullExpl}</div>`;
    h+=`<div class="fb" id="codefb${cur}"></div>`;
    h+=`<button class="nxt" id="nxt${cur}" onclick="goNext()">Дальше →</button>`;
    h+=`</div>`;

    document.getElementById('area').innerHTML=h;
}

function togH(id){document.getElementById(id).classList.toggle('show')}

function chk(lv,si){
    const inp=document.getElementById(`in${lv}_${si}`);
    const val=parseInt(inp.value);
    if(isNaN(val))return;
    const correct=levels[lv].subs[si].ans;
    const fb=document.getElementById(`fb${lv}_${si}`);

    if(val===correct){
        att[lv][si]===0 ? addScore(PTS1) : addScore(PTS2);
        fb.className='fb show ok';
        fb.textContent=att[lv][si]===0?`✅ Верно! +${PTS1} монет`:`✅ Верно! +${PTS2} монет (не с первой попытки)`;
        inp.disabled=true;
        document.getElementById(`go${lv}_${si}`).disabled=true;
        checkAllDone(lv);
    } else {
        att[lv][si]++;
        fb.className='fb show no';
        fb.textContent='🤔 Не совсем... Попробуй ещё! Можешь открыть подсказку.';
        inp.value='';
        inp.style.borderColor='#ff8a65';
        setTimeout(()=>{inp.style.borderColor='#546e7a';},800);
    }
}

function checkAllDone(lv){
    const subs=levels[lv].subs;
    for(let i=0;i<subs.length;i++){
        if(!document.getElementById(`in${lv}_${i}`).disabled) return;
    }
    // all done
    document.getElementById(`expl${lv}`).classList.add('show');
    const cfb=document.getElementById(`codefb${lv}`);
    cfb.className='fb show half';
    cfb.innerHTML=levels[lv].codeExpl;
    revealCode(lv, levels[lv].codeDigit);
    document.getElementById(`nxt${lv}`).classList.add('show');
}

function addScore(pts){
    score+=pts;
    document.getElementById('scB').textContent=`Монеты: ${score}`;
}

function goNext(){
    cur++;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
}

function finale(){
    document.getElementById('pf').style.width='100%';
    document.getElementById('lvB').textContent='Сундук открыт!';
    const codeStr=CODE.join('');
    let t='',e='';
    if(score>=140){t='Капитан Комбинаторики!';e='👑🏴‍☠️';}
    else if(score>=100){t='Старший помощник!';e='⭐🏴‍☠️';}
    else if(score>=60){t='Юнга-математик!';e='🧮⚓';}
    else{t='Начинающий пират!';e='🌊📚';}
    document.getElementById('area').innerHTML=`<div class="card active"><div class="finale">
        <div class="big">${e}</div>
        <h2>Сундук открыт!</h2>
        <p>Код замка: <strong style="color:#ffd54f;font-size:1.4em;letter-spacing:6px">${codeStr}</strong></p>
        <div class="sc">${score} монет</div>
        <p>Твоё звание: <strong>${t}</strong></p>
        <p style="color:#78909c;font-size:.9em;margin-top:14px;">Максимум: ${TOTAL*3*PTS1} монет (все с первой попытки)</p>
        <button class="again" onclick="restart()">Пройти ещё раз</button>
    </div></div>`;
}

function restart(){
    score=0;cur=0;att={};
    document.getElementById('scB').textContent='Монеты: 0';
    initCode();render();
    window.scrollTo({top:0,behavior:'smooth'});
}

// Enter key
document.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
        const focused=document.activeElement;
        if(focused&&focused.tagName==='INPUT'&&focused.id.startsWith('in')){
            const parts=focused.id.replace('in','').split('_');
            const goBtn=document.getElementById(`go${parts[0]}_${parts[1]}`);
            if(goBtn&&!goBtn.disabled) goBtn.click();
        }
    }
});

initCode();
render();
</script>
</body>
</html>
