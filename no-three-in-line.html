<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Никакие три на одной прямой</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
        font-family:'Segoe UI',Arial,sans-serif;
        background:linear-gradient(180deg,#eef3fb 0%,#ecfeff 60%,#f5f3ff 100%);
        color:#0f2c3a;display:flex;flex-direction:column;padding:10px 12px;gap:10px;overflow:hidden;
    }

    .bar{
        background:#fff;border:3px solid #0e7490;border-radius:12px;
        padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
        box-shadow:0 2px 8px rgba(0,0,0,.10);flex:none;
    }
    .bar .title{font-size:1.15em;font-weight:800;color:#0e7490;margin-right:auto}
    .bar .lbl{font-size:.95em;color:#475569;font-weight:700}

    button{
        font-family:inherit;font-size:.98em;font-weight:700;padding:7px 13px;border-radius:8px;
        border:2px solid #0e7490;background:#fff;color:#0e7490;cursor:pointer;
    }
    button:hover{background:#ecfeff}
    button.solid{background:#0e7490;color:#fff}
    button.solid:hover{background:#0b6076}

    .grid{
        flex:1;min-height:0;display:grid;gap:10px;
        grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    }
    @media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}}

    .card{
        background:#fff;border:3px solid #0e7490;border-radius:12px;padding:7px 9px 9px;
        display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 7px rgba(0,0,0,.10);
    }
    .head{display:flex;align-items:center;gap:8px;flex:none;margin-bottom:5px}
    .who{
        font-weight:800;color:#0e7490;font-size:1.02em;min-width:26px;padding:2px 6px;
        border-bottom:2px dashed #b6e0eb;outline:none;
    }
    .who:focus{border-bottom-color:#0e7490;background:#ecfeff}
    .job{font-size:.94em;font-weight:700;color:#475569;margin-right:auto;white-space:nowrap}
    .nx{padding:4px 11px;font-size:.94em;border-radius:7px}

    .b{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
    .b svg{max-width:100%;max-height:100%;width:auto;height:auto}

    .hint{flex:none;text-align:center;color:#475569;font-size:.9em}
    .hint b{color:#0e7490}
</style>
</head>
<body>

<div class="bar">
    <div class="title">🎯 Никакие три на одной прямой</div>
    <div class="lbl">Всем сразу:</div>
    <button data-all="5">5 × 5</button>
    <button data-all="6">6 × 6</button>
    <button data-all="7">7 × 7</button>
    <button class="solid" id="reset">Все поля заново</button>
</div>

<div class="grid" id="grid"></div>

<div class="hint">Клик по <b>→</b> в углу поля даёт этому ребёнку следующую задачу. Клавиши <b>1</b>…<b>6</b> делают то же самое. Имена в углах можно вписать своими.</div>

<script>
const SIZES = [5, 6, 7];
const COUNT = 6;
const state = Array.from({length: COUNT}, () => 0);   // индекс в SIZES
const names = Array.from({length: COUNT}, (_, i) => String(i + 1));

function boardSvg(n) {
    const cell = 96, pad = 12, S = n * cell + pad * 2;
    let s = `<svg viewBox="0 0 ${S} ${S}" role="img">`;
    for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++) {
            const x = pad + c * cell, y = pad + r * cell;
            s += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="#fff" stroke="#0e7490" stroke-width="2" opacity=".5"/>`;
            s += `<circle cx="${x + cell/2}" cy="${y + cell/2}" r="4.5" fill="#0e7490" opacity=".32"/>`;
        }
    s += `<rect x="${pad}" y="${pad}" width="${n*cell}" height="${n*cell}" fill="none" stroke="#0e7490" stroke-width="4"/>`;
    return s + `</svg>`;
}

function render() {
    document.getElementById('grid').innerHTML = state.map((si, i) => {
        const n = SIZES[si];
        return `<div class="card">
            <div class="head">
                <span class="who" contenteditable="true" data-i="${i}">${names[i]}</span>
                <span class="job">${n} × ${n}, отметить ${2*n}</span>
                <button class="nx" data-i="${i}">→</button>
            </div>
            <div class="b">${boardSvg(n)}</div>
        </div>`;
    }).join('');

    document.querySelectorAll('.nx').forEach(b => b.onclick = () => next(+b.dataset.i));
    document.querySelectorAll('.who').forEach(w => {
        w.onblur = () => { names[+w.dataset.i] = w.textContent.trim() || String(+w.dataset.i + 1); };
        w.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); w.blur(); } };
    });
}

function next(i) { state[i] = (state[i] + 1) % SIZES.length; render(); }
function allTo(n) { const si = SIZES.indexOf(n); state.fill(si); render(); }

document.querySelectorAll('[data-all]').forEach(b => b.onclick = () => allTo(+b.dataset.all));
document.getElementById('reset').onclick = () => { state.fill(0); render(); };

document.addEventListener('keydown', e => {
    if (document.activeElement && document.activeElement.isContentEditable) return;
    const k = +e.key;
    if (k >= 1 && k <= COUNT) { e.preventDefault(); next(k - 1); }
});

render();
</script>
</body>
</html>
