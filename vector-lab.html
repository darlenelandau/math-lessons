<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Векторная лаборатория</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f7f9fb; --paper: #fff; --grid: #e6edf3; --ink: #17232d; --muted: #5d6d79; --line: #d5dee6; --faint: #c3ced7;
  --accent: #1f6f8b; --accent-soft: #e3f0f5;
  --va: #d0532e; --vb: #1f63c9; --vc: #2f8a46; --vr: #7a4fc4; --q: #c4880a;
  --ok: #2f7d4f; --ok-soft: #e4f3ea; --no: #b5452f; --no-soft: #fbe9e4; --warn: #b8730a; --warn-soft: #fff4dd;
  --hint: #7a5cc4; --hint-soft: #efeafb;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 60px; color: var(--ink); background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; font: 16px/1.55 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.2; }
h2 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
.lead { margin: 0; color: var(--muted); max-width: 80ch; }
.tabs, .topics { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 600 .95rem "Golos Text", sans-serif; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); cursor: pointer; }
.tab:hover, .tab:focus-visible { border-color: var(--accent); outline: none; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tp { font: 600 .86rem "Golos Text", sans-serif; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--accent); cursor: pointer; }
.tp:hover { border-color: var(--accent); }
.tp.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tp.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.tp.on.done { background: var(--ok); color: #fff; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: clamp(14px, 3vw, 22px);
  display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .sheet { grid-template-columns: minmax(0, 1fr); } }
.colL { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
@media (max-width: 900px) { .colL { position: static; } }
.colR { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
svg.plane { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; background: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
svg.plane.grab { cursor: grab; } svg.plane.dragging { cursor: grabbing; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.ctl label { display: inline-flex; gap: 8px; align-items: center; font-size: .92rem; color: var(--muted); }
.ctl input[type="range"] { width: 180px; accent-color: var(--accent); }
.btn { font: 600 .9rem "Golos Text", sans-serif; padding: 7px 13px; border-radius: 7px; border: 1px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; }
.btn:hover, .btn:focus-visible { background: var(--accent-soft); outline: none; }
.btn.main { background: var(--accent); color: #fff; }
.btn.help { border-color: var(--hint); color: var(--hint); }
.btn.help:hover { background: var(--hint-soft); }
.btn.minor { border-color: var(--line); color: var(--ink); }
.box { border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.exp { border: 1.5px solid var(--q); background: #fffaf0; }
.exp > b:first-child { color: var(--q); font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; }
.read { border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ok { background: var(--ok-soft); border-left: 3px solid var(--ok); }
.no { background: var(--no-soft); border-left: 3px solid var(--no); }
.warn { background: var(--warn-soft); border-left: 3px solid var(--warn); }
.info { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.sum { border: 1.5px solid var(--ok); background: var(--ok-soft); }
.sum > b:first-child { color: var(--ok); font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; }
ol.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
ol.steps li.new { animation: appear .4s ease-out; }
@keyframes appear { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { ol.steps li.new { animation: none; } }
.m { font-family: "Times New Roman", Times, serif; font-size: 1.12em; white-space: nowrap; }
.m i { font-style: italic; }
.vec { position: relative; display: inline-block; font-style: italic; padding-top: .28em; line-height: 1; }
.vec::before { content: ''; position: absolute; left: 6%; right: 2%; top: .08em; border-top: 1.4px solid currentColor; }
.vec::after { content: ''; position: absolute; right: 0; top: -.08em; border: .17em solid transparent; border-left: .32em solid currentColor; border-right: 0; }
.formula { font-family: "Times New Roman", Times, serif; font-size: 1.22em; padding: 6px 0; }
.ans { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ans input { width: 7.5em; font: 500 1.05rem "Golos Text", sans-serif; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; }
.ans input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ans input.right { border-color: var(--ok); background: var(--ok-soft); }
.ans input.wrong { border-color: var(--no); background: var(--no-soft); }
.cond { font-size: 1.07rem; }
.types { display: flex; flex-wrap: wrap; gap: 5px; }
.types button { font: 500 .8rem "Golos Text", sans-serif; padding: 4px 9px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.types button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.stat { color: var(--muted); font-size: .88rem; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.plan { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.lbl { font: italic 19px "Times New Roman", Times, serif; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.num { font: 12px "Golos Text", sans-serif; fill: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <h1>Векторная лаборатория</h1>
    <div class="tabs" role="tablist" id="parts"></div>
    <div class="topics" id="topics"></div>
  </header>
  <section class="sheet">
    <div class="colL">
      <svg class="plane" id="plane" viewBox="0 0 456 456" role="img" aria-label="Координатная плоскость"></svg>
      <p class="hint" id="planeHint"></p>
      <div class="ctl" id="planeCtl"></div>
    </div>
    <div class="colR" id="right"></div>
  </section>
</div>

<script>
/*LOGIC-START*/
var VEC = (function () {
  /* ---------- числа ---------- */
  function minus(s) { return String(s).replace(/-/g, '−'); }
  function round(v, d) { var p = Math.pow(10, d || 6); return Math.round(v * p) / p; }
  function fmt(v) { return minus(String(round(v, 6)).replace('.', ',')); }
  function nice(v, d) { var p = Math.pow(10, d); return Math.abs(v * p - Math.round(v * p)) < 1e-7; }
  function isSq(n) { var r = Math.round(Math.sqrt(n)); return r * r === n; }
  /* √n в упрощённом виде: 2√13 */
  function sqrtTxt(n) {
    if (isSq(n)) return String(Math.round(Math.sqrt(n)));
    var k = 1, m = n;
    for (var d = 2; d * d <= m; d++) while (m % (d * d) === 0) { m /= d * d; k *= d; }
    return (k > 1 ? k : '') + '√' + m;
  }
  /* разбор ответа: «−6,6», «1/2», «2√13», «√26» */
  function parse(s) {
    if (s == null) return NaN;
    s = String(s).trim().replace(/\s+/g, '').replace(/−/g, '-').replace(/,/g, '.');
    if (!s) return NaN;
    var m = /^(-?)(\d*(?:\.\d+)?)?(?:√|sqrt)\(?(\d+(?:\.\d+)?)\)?$/.exec(s);
    if (m) { var k = m[2] === undefined || m[2] === '' ? 1 : parseFloat(m[2]); return (m[1] ? -1 : 1) * k * Math.sqrt(parseFloat(m[3])); }
    m = /^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/.exec(s);
    if (m) return parseFloat(m[1]) / parseFloat(m[2]);
    return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
  }
  function same(a, b) { return Math.abs(a - b) < 1e-6 * Math.max(1, Math.abs(b)); }

  /* ---------- случайности ---------- */
  var rnd = Math.random;
  function setRnd(f) { rnd = f; }
  function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
  function sg() { return rnd() < 0.5 ? -1 : 1; }
  var TRIPLES = [[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [7, 24, 25], [9, 12, 15], [12, 16, 20], [20, 21, 29], [10, 24, 26], [9, 40, 41], [15, 20, 25], [12, 35, 37]];
  function tripleVec(maxLeg) {
    var t = pick(TRIPLES.filter(function (t) { return t[1] <= maxLeg; }));
    var v = rnd() < 0.5 ? [t[0], t[1]] : [t[1], t[0]];
    return { v: [v[0] * sg(), v[1] * sg()], len: t[2] };
  }
  function randVec(m) { var v; do { v = [ri(-m, m), ri(-m, m)]; } while (!v[0] && !v[1]); return v; }

  /* ---------- запись ---------- */
  function V(n) { return '<span class="vec">' + n + '</span>'; }
  function co(v) { return '(' + fmt(v[0]) + '; ' + fmt(v[1]) + ')'; }
  function M(s) { return '<span class="m">' + s + '</span>'; }
  function P(n, p) { return '<i>' + n + '</i>' + co(p); }
  function par(x) { return x < 0 ? '(' + fmt(x) + ')' : fmt(x); }
  /* линейная комбинация: [[0.8,'a'],[-2.3,'b']] → «0,8a − 2,3b» */
  function comb(terms) {
    return terms.map(function (t, i) {
      var c = t[0], s = c < 0 ? (i ? ' − ' : '−') : (i ? ' + ' : '');
      var a = Math.abs(c);
      return s + (a === 1 ? '' : fmt(a)) + V(t[1]);
    }).join('');
  }
  function lin(terms, vecs) {
    var x = 0, y = 0;
    terms.forEach(function (t) { x += t[0] * vecs[t[1]][0]; y += t[0] * vecs[t[1]][1]; });
    return [round(x, 6), round(y, 6)];
  }
  function dot(a, b) { return round(a[0] * b[0] + a[1] * b[1], 6); }
  function len2(a) { return round(a[0] * a[0] + a[1] * a[1], 6); }
  /* расстановка векторов рисунка: целые начала, всё помещается в [−8; 8], начала не совпадают */
  function place(vecs) {
    for (var tries = 0; tries < 400; tries++) {
      var res = {}, ok = true, used = [];
      Object.keys(vecs).forEach(function (k) {
        var v = vecs[k], x0 = Math.max(-8, -8 - v[0]), x1 = Math.min(8, 8 - v[0]), y0 = Math.max(-8, -8 - v[1]), y1 = Math.min(8, 8 - v[1]);
        if (x0 > x1 || y0 > y1) { ok = false; return; }
        var s = [ri(x0, x1), ri(y0, y1)];
        if (used.some(function (u) { return Math.abs(u[0] - s[0]) + Math.abs(u[1] - s[1]) < 3; })) ok = false;
        used.push(s, [s[0] + v[0], s[1] + v[1]]);
        res[k] = { s: s, v: v };
      });
      if (ok) return res;
    }
    return null;
  }

  /* =================== генераторы задач =================== */
  var GEN = {};
  GEN.len = { part: 1, name: 'длина по координатам', make: function () {
    var t = rnd() < 0.12 ? { v: [sg() * ri(2, 15), 0], len: 0 } : tripleVec(24);
    if (!t.len) { t.len = Math.abs(t.v[0]); if (rnd() < 0.5) t.v = [0, t.v[0]]; }
    var a = t.v;
    return { text: 'Найдите длину вектора ' + M(V('a') + co(a)) + '.', ans: t.len,
      hint: 'Длина вектора: ' + M('|' + V('a') + '| = √(<i>x</i>² + <i>y</i>²)') + '.',
      sol: [M('|' + V('a') + '| = √(' + par(a[0]) + '² + ' + par(a[1]) + '²) = √' + len2(a) + ' = ' + t.len)] };
  } };
  GEN.ABc = { part: 1, name: 'координаты вектора по точкам', make: function () {
    var A = [ri(-9, 9), ri(-9, 9)], B;
    do { B = [ri(-9, 9), ri(-9, 9)]; } while (B[0] === A[0] && B[1] === A[1]);
    var v = [B[0] - A[0], B[1] - A[1]];
    return { text: 'Найдите координаты вектора ' + M(V('AB')) + ', где ' + M(P('A', A)) + ' и ' + M(P('B', B)) + '.', pair: v,
      hint: 'Из координат конца вычитаем координаты начала.',
      sol: [M(V('AB') + ' = (<i>x<sub>B</sub></i> − <i>x<sub>A</sub></i>; <i>y<sub>B</sub></i> − <i>y<sub>A</sub></i>) = (' + fmt(B[0]) + ' − ' + par(A[0]) + '; ' + fmt(B[1]) + ' − ' + par(A[1]) + ') = ' + co(v))] };
  } };
  GEN.ABl = { part: 1, name: 'длина вектора по точкам', make: function () {
    var t = tripleVec(12), A, B;
    do { A = [ri(-9, 9), ri(-9, 9)]; B = [A[0] + t.v[0], A[1] + t.v[1]]; } while (Math.abs(B[0]) > 12 || Math.abs(B[1]) > 12);
    return { text: 'Найдите длину вектора ' + M(V('AB')) + ', где ' + M(P('A', A)) + ' и ' + M(P('B', B)) + '.', ans: t.len,
      hint: 'Сначала найдите координаты вектора: конец минус начало. Потом длину по Пифагору.',
      sol: [M(V('AB') + ' = ' + co(t.v)), M('|' + V('AB') + '| = √(' + par(t.v[0]) + '² + ' + par(t.v[1]) + '²) = √' + len2(t.v) + ' = ' + t.len)] };
  } };
  function picVecs(names, maker) {
    for (var i = 0; i < 300; i++) {
      var vs = {}; names.forEach(function (n) { vs[n] = maker(n); });
      var pl = place(vs);
      if (pl) return pl;
    }
    return null;
  }
  GEN.picC = { part: 1, name: 'координаты по рисунку', pic: true, make: function () {
    var pl = picVecs(['a', 'b'], function () { return randVec(6); }), k = pick(['a', 'b']), v = pl[k].v;
    return { text: 'На координатной плоскости изображены векторы ' + M(V('a')) + ' и ' + M(V('b')) + '. Найдите координаты вектора ' + M(V(k)) + '.', pair: v, pic: pl,
      hint: 'Посчитайте клетки от начала стрелки до её конца: сколько вправо (или влево, со знаком минус) и сколько вверх (или вниз).',
      sol: ['Начало ' + M(V(k)) + ' в точке ' + M(co(pl[k].s)) + ', конец в точке ' + M(co([pl[k].s[0] + v[0], pl[k].s[1] + v[1]])) + '.', 'Конец минус начало: ' + M(V(k) + ' = ' + co(v)) + '.'] };
  } };
  GEN.picL = { part: 1, name: 'длина по рисунку', pic: true, make: function () {
    var k = pick(['a', 'b']), t;
    var pl = picVecs(['a', 'b'], function (n) { if (n === k) { t = rnd() < 0.15 ? { v: [0, sg() * ri(3, 8)], len: 0 } : tripleVec(8); if (!t.len) t.len = Math.abs(t.v[1]); return t.v; } return randVec(6); });
    var v = pl[k].v;
    return { text: 'На координатной плоскости изображены векторы ' + M(V('a')) + ' и ' + M(V('b')) + '. Найдите длину вектора ' + M(V(k)) + '.', ans: t.len, pic: pl,
      hint: 'Найдите координаты по клеткам, потом длину по Пифагору.',
      sol: [M(V(k) + ' = ' + co(v)), M('|' + V(k) + '| = √(' + par(v[0]) + '² + ' + par(v[1]) + '²) = ' + t.len)] };
  } };
  GEN.param = { part: 1, name: 'неизвестная координата по длине', make: function () {
    for (var i = 0; i < 500; i++) {
      var a = [ri(-6, 6), ri(-6, 6)], k = pick([1.5, 2, 2.5, 3, 0.5]), m = ri(-9, 9);
      if (!a[0] || !a[1]) continue;
      var b2 = k * k * len2(a) - m * m;
      if (b2 <= 0) continue;
      var b0 = Math.sqrt(b2);
      if (!nice(b0 * 2, 0) || b0 < 0.5) continue;
      b0 = round(b0, 6);
      return { text: 'Даны векторы ' + M(V('a') + co(a)) + ' и ' + M(V('b') + '(<i>b</i><sub>0</sub>; ' + fmt(m) + ')') + '. Найдите ' + M('<i>b</i><sub>0</sub>') + ', если ' + M('|' + V('b') + '| = ' + fmt(k) + '|' + V('a') + '|') + '. Если таких значений несколько, в ответ запишите большее из них.', ans: b0,
        hint: 'Возведите условие в квадрат: ' + M('|' + V('b') + '|² = ' + fmt(k * k) + '|' + V('a') + '|²') + '.',
        sol: [M('|' + V('a') + '|² = ' + par(a[0]) + '² + ' + par(a[1]) + '² = ' + len2(a)), M('|' + V('b') + '|² = ' + fmt(k) + '² · ' + len2(a) + ' = ' + fmt(k * k * len2(a))),
          M('<i>b</i><sub>0</sub>² + ' + par(m) + '² = ' + fmt(k * k * len2(a))) + ', ' + M('<i>b</i><sub>0</sub>² = ' + fmt(b2)) + ', ' + M('<i>b</i><sub>0</sub> = ±' + fmt(b0)) + '.', 'Большее значение: ' + M(fmt(b0)) + '.'] };
    }
  } };
  var COEF = [2, 3, -2, -3, 0.5, -0.5, 0.2, -0.2, 2.5, 1.5, 4, -5, 6, -1, 1];
  GEN.comb = { part: 1, name: 'сумма координат комбинации', make: function () {
    for (var i = 0; i < 500; i++) {
      var f = [ri(-12, 12) * pick([1, 0.5]), ri(-12, 12) * pick([1, 0.5])], e = [ri(-15, 15), ri(-15, 15)];
      var al = pick(COEF), be = pick(COEF), g = lin([[al, 'f'], [be, 'e']], { f: f, e: e });
      if (!nice(g[0], 2) || !nice(g[1], 2) || Math.abs(g[0] + g[1]) > 200) continue;
      var k = rnd() < 0.3 ? pick([3, 2, 0.5]) : 1;
      var sumv = round((g[0] + g[1]) * (k === 1 ? 1 : 1), 6);
      var lhs = k === 1 ? V('g') : (k === 0.5 ? '2' : '1/' + k) + V('g');
      var gg = k === 1 ? g : [round(g[0] * (k === 0.5 ? 0.5 : k), 6), round(g[1] * (k === 0.5 ? 0.5 : k), 6)];
      if (k !== 1 && (!nice(gg[0], 2) || !nice(gg[1], 2))) continue;
      sumv = round(gg[0] + gg[1], 6);
      var sol = [M(comb([[al, 'f'], [be, 'e']]) + ' = (' + fmt(al) + ' · ' + par(f[0]) + ' + ' + par(be) + ' · ' + par(e[0]) + '; ' + fmt(al) + ' · ' + par(f[1]) + ' + ' + par(be) + ' · ' + par(e[1]) + ') = ' + co(g))];
      if (k !== 1) sol.push('Тогда ' + M(V('g') + ' = ' + (k === 0.5 ? '½' : k) + ' · ' + co(g) + ' = ' + co(gg)) + '.');
      sol.push('Сумма координат: ' + M(fmt(gg[0]) + ' + ' + par(gg[1]) + ' = ' + fmt(sumv)) + '.');
      return { text: 'Даны векторы ' + M(V('f') + co(f)) + ' и ' + M(V('e') + co(e)) + '. Найдите координаты вектора ' + M(V('g')) + ', если ' + M(lhs + ' = ' + comb([[al, 'f'], [be, 'e']])) + '. В ответ запишите сумму координат вектора ' + M(V('g')) + '.', ans: sumv,
        hint: 'Умножаем на число — каждую координату; складываем векторы — координаты по отдельности.', sol: sol };
    }
  } };
  function combLenTask(pic) {
    for (var i = 0; i < 3000; i++) {
      var names = rnd() < 0.5 ? ['a', 'b'] : ['a', 'b', 'c'];
      var vs = {}; names.forEach(function (n) { vs[n] = pic ? randVec(6) : [ri(-14, 14), ri(-14, 14)]; });

    title: 'Длина суммы и разности',
    intro: 'Когда координат нет, а есть длины и скалярное произведение, длину суммы находят через скалярный квадрат.',
    init: { a: [5, 1], b: [1, 4] },
    exp: 'Сделай так, чтобы ' + M('|' + V('a') + ' + ' + V('b') + '| = |' + V('a') + ' − ' + V('b') + '|') + '. Какой тогда угол между ' + M(V('a')) + ' и ' + M(V('b')) + '?',
    done: function (s) { return VEC.len2(add(s.a, s.b)) === VEC.len2(sub(s.a, s.b)); },
    draw: function (s) {
      var Oo = [0, 0], P = add(s.a, s.b);
      el('path', { d: 'M' + sp(Oo).join(' ') + 'L' + sp(s.a).join(' ') + 'L' + sp(P).join(' ') + 'L' + sp(s.b).join(' ') + 'Z', fill: 'var(--vr)', 'fill-opacity': 0.07, stroke: '#cdbff0', 'stroke-dasharray': '5 4' });
      arrow(Oo, P, C.r, { label: 'a+b', side: -1, w: 3 });
      arrow(s.b, s.a, C.c, { label: 'a−b', side: 1, w: 3 });
      arrow(Oo, s.a, C.a, { label: 'a', side: -1 }); arrow(Oo, s.b, C.b, { label: 'b', side: 1 });
      handle('a', s.a, C.a); handle('b', s.b, C.b);
      var A2 = VEC.len2(s.a), B2 = VEC.len2(s.b), D = VEC.dot(s.a, s.b);
      return '<div class="m">' + M('|' + V('a') + '|² = ' + A2 + ', |' + V('b') + '|² = ' + B2 + ', ' + V('a') + ' · ' + V('b') + ' = ' + fmt(D)) + '</div>' +
        '<div class="m">' + M('|' + V('a') + ' + ' + V('b') + '|² = ' + A2 + ' + 2 · ' + par(D) + ' + ' + B2 + ' = ' + (A2 + 2 * D + B2)) + '</div>' +
        '<div class="m">' + M('|' + V('a') + ' − ' + V('b') + '|² = ' + A2 + ' − 2 · ' + par(D) + ' + ' + B2 + ' = ' + (A2 - 2 * D + B2)) + '</div>';
    },
    drag: function (s, id, p) { if (p[0] || p[1]) s[id] = p; },
    steps: [
      'Длину считаем через скалярный квадрат: ' + M('|' + V('a') + ' + ' + V('b') + '|² = (' + V('a') + ' + ' + V('b') + ') · (' + V('a') + ' + ' + V('b') + ')') + '.',
      'Раскрываем скобки, как ' + M('(<i>x</i> + <i>y</i>)²') + ': ' + M('|' + V('a') + ' + ' + V('b') + '|² = |' + V('a') + '|² + 2 ' + V('a') + ' · ' + V('b') + ' + |' + V('b') + '|²') + '. Для разности то же с минусом.',
      'Если диагонали параллелограмма равны, то ' + M('2' + V('a') + '·' + V('b') + ' = −2' + V('a') + '·' + V('b')) + ', то есть ' + M(V('a') + ' · ' + V('b') + ' = 0') + ': векторы перпендикулярны, а параллелограмм — прямоугольник.',
      'Задача из ЕГЭ: ' + M('|' + V('a') + '| = 5, |' + V('b') + '| = 8, ' + V('a') + ' · ' + V('b') + ' = 12') + ', найти ' + M('|3' + V('a') + ' + ' + V('b') + '|') + '. ' + M('|3' + V('a') + ' + ' + V('b') + '|² = 9 · 25 + 2 · 3 · 12 + 64 = 361') + ', ответ ' + M('19') + '.'
    ],
    sum: M('|<i>m</i>' + V('a') + ' + <i>n</i>' + V('b') + '|² = <i>m</i>²|' + V('a') + '|² + 2<i>mn</i> ' + V('a') + '·' + V('b') + ' + <i>n</i>²|' + V('b') + '|²')
  };
  TOPICS['2.5'] = {
    title: 'Векторы в треугольнике',
    intro: 'В геометрических задачах ЕГЭ векторы задают сторонами треугольника. Главное — правильно увидеть угол между ними.',
    init: { A: [-6, -3], B: [5, -3], Cc: [-1, 5], show: 'diff' },
    exp: 'Тяни вершины. Сделай угол ' + M('<i>C</i>') + ' прямым.',
    done: function (s) { return VEC.dot(sub(s.A, s.Cc), sub(s.B, s.Cc)) === 0; },
    ctl: function (s) { ctlToggle([['diff', 'CA − CB'], ['sum', 'BA + BC'], ['ang', 'AB · AC и AB · CA']], s.show, function (v) { s.show = v; render(); }); },
    draw: function (s) {
      el('path', { d: 'M' + sp(s.A).join(' ') + 'L' + sp(s.B).join(' ') + 'L' + sp(s.Cc).join(' ') + 'Z', fill: '#f4f7fa', stroke: '#9fb0bc', 'stroke-width': 1.4 });
      var out = '';
      if (s.show === 'diff') {
        arrow(s.Cc, s.A, C.a, { label: 'CA', side: 1 }); arrow(s.Cc, s.B, C.b, { label: 'CB', side: -1 });
        arrow(s.B, s.A, C.r, { label: 'BA', side: 1, w: 3 });
        out = M(V('CA') + ' − ' + V('CB') + ' = ' + V('BA')) + ', ' + M('|' + V('CA') + ' − ' + V('CB') + '| = <i>AB</i> = ' + lenTxt(sub(s.A, s.B)));
      } else if (s.show === 'sum') {
        var Mm = [(s.A[0] + s.Cc[0]) / 2, (s.A[1] + s.Cc[1]) / 2], D = add(s.B, add(sub(s.A, s.B), sub(s.Cc, s.B)));
        seg(s.A, D, '#cdbff0', 1.3, true); seg(s.Cc, D, '#cdbff0', 1.3, true);
        arrow(s.B, s.A, C.a, { label: 'BA', side: 1 }); arrow(s.B, s.Cc, C.b, { label: 'BC', side: -1 });
        arrow(s.B, D, C.r, { label: 'BA+BC', side: 1, w: 3, plain: true });
        dotP(Mm, C.q, 4.5, 'M', 8, 14);
        out = M(V('BA') + ' + ' + V('BC') + ' = 2' + V('BM')) + ', где ' + M('<i>M</i>') + ' — середина ' + M('<i>AC</i>') + '. Длина: ' + M(lenTxt(add(sub(s.A, s.B), sub(s.Cc, s.B)))) + '.';
      } else {
        var ab = sub(s.B, s.A), ac = sub(s.Cc, s.A), ca = sub(s.A, s.Cc);
        arrow(s.A, s.B, C.a, { label: 'AB', side: -1 }); arrow(s.A, s.Cc, C.b, { label: 'AC', side: 1 });
        arrow(s.A, add(s.A, ca), C.c, { label: 'CA', side: -1, dash: true });
        out = M(V('AB') + ' · ' + V('AC') + ' = ' + fmt(VEC.dot(ab, ac))) + ', ' + M(V('AB') + ' · ' + V('CA') + ' = ' + fmt(VEC.dot(ab, ca))) + ' (вектор ' + M(V('CA')) + ' перенесён в точку ' + M('<i>A</i>') + ' пунктиром).';
      }
      dotP(s.A, C.ink, 4, 'A', -16, 4); dotP(s.B, C.ink, 4, 'B', 8, 4); dotP(s.Cc, C.ink, 4, 'C', 6, -8);
      handle('A', s.A, C.ink); handle('B', s.B, C.ink); handle('Cc', s.Cc, C.ink);
      return '<div>' + out + '</div><div class="m">' + M('∠<i>C</i> ≈ ' + fmt(Math.round(angDeg(sub(s.A, s.Cc), sub(s.B, s.Cc)) * 10) / 10) + '°') + '</div>';
    },
    drag: function (s, id, p) { s[id] = p; },
    steps: [
      '<b>Разность с общим началом</b> (вид «CA − CB»): идёт из конца вычитаемого в конец уменьшаемого, ' + M(V('CA') + ' − ' + V('CB') + ' = ' + V('BA')) + '. Значит, ' + M('|' + V('CA') + ' − ' + V('CB') + '| = <i>AB</i>') + ' — сторона треугольника.',
      '<b>Сумма с общим началом</b> (вид «BA + BC»): диагональ параллелограмма, она вдвое длиннее медианы: ' + M(V('BA') + ' + ' + V('BC') + ' = 2' + V('BM')) + '.',
      '<b>Скалярное с общим началом</b> (вид «AB · AC»): угол между векторами — угол треугольника при этой вершине. В равностороннем со стороной ' + M('<i>a</i>') + ': ' + M(V('AB') + ' · ' + V('AC') + ' = <i>a</i>² · cos 60° = <i>a</i>²/2') + '.',
      '<b>Ловушка</b> (вид «AB · CA»): векторы выходят не из одной точки. Перенесём ' + M(V('CA')) + ' в ' + M('<i>A</i>') + ' (пунктир): угол между ними ' + M('180° − ∠<i>A</i>') + ', поэтому ' + M(V('AB') + ' · ' + V('CA') + ' = −' + V('AB') + ' · ' + V('AC')) + '.'
    ],
    sum: M(V('CA') + ' − ' + V('CB') + ' = ' + V('BA')) + '; ' + M(V('BA') + ' + ' + V('BC') + ' = 2' + V('BM')) + '; угол между векторами ищем, отложив их от одной точки.'
  };
  /* ---- тренажёры ---- */
  TOPICS['1.T'] = { title: 'Задачи как на ЕГЭ', trainer: 1 };
  TOPICS['2.T'] = { title: 'Задачи как на ЕГЭ', trainer: 2 };
  TOPICS['3.0'] = { title: 'Скоро', soon: true };

  var PARTS = {
    1: { name: '1. Введение', topics: ['1.1', '1.2', '1.3', '1.4', '1.5', '1.6', '1.T'] },
    2: { name: '2. Скалярное произведение', topics: ['2.1', '2.2', '2.3', '2.4', '2.5', '2.T'] },
    3: { name: '3. Координатный метод', topics: ['3.0'] }
  };

  /* ---------- отрисовка ---------- */
  function nav() {
    var p = $('parts');
    p.innerHTML = '';
    Object.keys(PARTS).forEach(function (k) {
      var b = document.createElement('button'); b.className = 'tab'; b.type = 'button'; b.textContent = PARTS[k].name;
      b.setAttribute('aria-selected', String(+k === S.part));
      b.onclick = function () { S.part = +k; render(); };
      p.appendChild(b);
    });
    var t = $('topics');
    t.innerHTML = '';
    PARTS[S.part].topics.forEach(function (id) {
      var T = TOPICS[id], b = document.createElement('button'); b.type = 'button';
      b.className = 'tp' + (S.topic[S.part] === id ? ' on' : '') + (topicDone(id) ? ' done' : '');
      b.textContent = T.trainer ? 'Тренажёр' : T.soon ? 'Раздел в разработке' : id + ' ' + T.title;
      b.onclick = function () { S.topic[S.part] = id; render(); };
      t.appendChild(b);
    });
  }
  function topicDone(id) { var T = TOPICS[id]; return T.steps && (S.step[id] || 0) >= T.steps.length; }
  function stOf(id) { if (!S.st[id]) S.st[id] = JSON.parse(JSON.stringify(TOPICS[id].init)); return S.st[id]; }

  var curTask = null;
  function render() {
    nav();
    var id = S.topic[S.part], T = TOPICS[id];
    handles = [];
    $('planeCtl').innerHTML = '';
    grid();
    if (T.trainer) { renderTrainer(T.trainer); save(); return; }
    if (T.soon) { renderSoon(); save(); return; }
    var s = stOf(id), step = S.step[id] || 0;
    var live = T.draw(s, step);
    if (T.ctl) T.ctl(s);
    $('planeHint').textContent = 'Кружки с пунктиром можно тянуть мышкой или пальцем. Точки встают в узлы сетки.';
    var ok = T.done(s);
    if (ok) S.expOk[id] = true;
    var h = '<h2>' + id + '. ' + T.title + '</h2><p style="margin:0">' + T.intro + '</p>';
    h += '<div class="box exp"><b>Опыт</b><div>' + T.exp + '</div>' + (ok ? '<div class="box ok" style="padding:6px 10px">Получилось!' + (step ? '' : ' Нажми «Дальше», чтобы разобраться, что произошло.') + '</div>' : '') + '</div>';
    h += '<div class="box read">' + live + '</div>';
    if (step > 0) h += '<ol class="steps">' + T.steps.slice(0, step).map(function (x, i) { return '<li' + (i === step - 1 ? ' class="new"' : '') + '>' + x + '</li>'; }).join('') + '</ol>';
    if (step >= T.steps.length) h += '<div class="box sum"><b>Итог</b><div class="formula">' + T.sum + '</div></div>';
    h += '<div class="ctl">';
    if (step < T.steps.length) h += '<button class="btn main" type="button" id="next">' + (step ? 'Дальше' : (S.expOk[id] ? 'Дальше' : 'Пропустить опыт и читать дальше')) + '</button>';
    if (step) h += '<button class="btn minor" type="button" id="back">Назад</button>';
    if (step >= T.steps.length) {
      var list = PARTS[S.part].topics, i2 = list.indexOf(id);
      if (list[i2 + 1]) h += '<button class="btn main" type="button" id="nextTopic">Следующая тема: ' + (TOPICS[list[i2 + 1]].trainer ? 'тренажёр' : TOPICS[list[i2 + 1]].title) + '</button>';
    }
    h += '<button class="btn minor" type="button" id="resetT">Вернуть чертёж</button></div>';
    $('right').innerHTML = h;
    if ($('next')) $('next').onclick = function () { S.step[id] = step + 1; render(); };
    if ($('back')) $('back').onclick = function () { S.step[id] = step - 1; render(); };
    if ($('nextTopic')) $('nextTopic').onclick = function () { var list = PARTS[S.part].topics; S.topic[S.part] = list[list.indexOf(id) + 1]; render(); };
    $('resetT').onclick = function () { delete S.st[id]; render(); };
    save();
  }
  function renderSoon() {
    $('planeHint').textContent = '';
    $('right').innerHTML = '<h2>3. Координатный метод</h2><p style="margin:0">Этот раздел появится позже. Он будет про векторы в пространстве и задачу 14 ЕГЭ.</p>' +
      '<div class="box info"><b>Что будет внутри</b><ol class="plan">' +
      '<li>Координаты в пространстве: точка, вектор, длина, середина отрезка.</li>' +
      '<li>Как ввести систему координат в кубе, призме, пирамиде.</li>' +
      '<li>Угол между прямыми через скалярное произведение.</li>' +
      '<li>Уравнение плоскости и вектор нормали.</li>' +
      '<li>Угол между прямой и плоскостью, между плоскостями.</li>' +
      '<li>Расстояние от точки до плоскости.</li></ol></div>';
  }

  /* =====================================================================
     Тренажёр: задачи как на ЕГЭ, свои числа каждый раз
     ===================================================================== */
  function renderTrainer(part) {
    var types = Object.keys(VEC.GEN).filter(function (k) { return VEC.GEN[k].part === part; });
    var sel = S.types[part] || 'all';
    if (!curTask || curTask.part !== part || (sel !== 'all' && curTask.type !== sel)) newTask(part);
    var t = curTask;
    if (t.pic) drawPic(t.pic); else $('planeHint').textContent = '';
    if (t.pic) $('planeHint').textContent = 'Векторы задачи. Начала и концы стрелок — в узлах сетки.';
    var nSolved = types.reduce(function (n, k) { return n + (S.solved[k] || 0); }, 0);
    var h = '<h2>Задачи как на ЕГЭ</h2><div class="types">' + '<button type="button" data-ty="all" class="' + (sel === 'all' ? 'on' : '') + '">все типы</button>' +
      types.map(function (k) { return '<button type="button" data-ty="' + k + '" class="' + (sel === k ? 'on' : '') + '">' + VEC.GEN[k].name + (S.solved[k] ? ' · ' + S.solved[k] : '') + '</button>'; }).join('') + '</div>';
    h += '<div class="stat">Решено в этой части: ' + nSolved + '</div>';
    h += '<div class="box read"><div class="cond">' + t.text + '</div>';
    if (t.pair) h += '<div class="ans">' + M('(') + '<input id="ax" inputmode="decimal" aria-label="первая координата">' + M(';') + '<input id="ay" inputmode="decimal" aria-label="вторая координата">' + M(')') + '</div>';
    else h += '<div class="ans"><span>Ответ:</span><input id="a1" inputmode="decimal" aria-label="ответ"></div>';
    h += '<div class="ctl"><button class="btn main" type="button" id="chk">Проверить</button><button class="btn help" type="button" id="hnt">Подсказка</button><button class="btn help" type="button" id="sol">Решение</button><button class="btn minor" type="button" id="nw">Новая задача</button></div>';
    h += '<div id="fb"></div></div>';
    h += '<p class="hint">Ответ можно вводить с запятой (−6,6), дробью (1/2) или с корнем (2√13 или 2sqrt13).</p>';
    $('right').innerHTML = h;
    [].forEach.call($('right').querySelectorAll('[data-ty]'), function (b) { b.onclick = function () { S.types[part] = b.dataset.ty; newTask(part); render(); }; });
    $('nw').onclick = function () { newTask(part); render(); };
    $('hnt').onclick = function () { fb('info', '<b>Подсказка.</b> ' + t.hint); };
    $('sol').onclick = function () { fb('info', '<b>Решение.</b><ol class="steps" style="margin-top:6px">' + t.sol.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol><div>Ответ: ' + M(t.pair ? co(t.pair) : fmt(t.ans)) + '</div>'); t.shown = true; };
    var inputs = t.pair ? [$('ax'), $('ay')] : [$('a1')];
    inputs.forEach(function (inp) { inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('chk').click(); }); });
    $('chk').onclick = function () {
      var ok;
      if (t.pair) {
        var x = VEC.parse($('ax').value), y = VEC.parse($('ay').value);
        if (isNaN(x) || isNaN(y)) { fb('warn', 'Впиши обе координаты числами.'); return; }
        var okx = VEC.same(x, t.pair[0]), oky = VEC.same(y, t.pair[1]);
        $('ax').className = okx ? 'right' : 'wrong'; $('ay').className = oky ? 'right' : 'wrong';
        ok = okx && oky;
        if (!ok) { fb('no', (okx || oky ? 'Одна координата верная, другая нет. ' : 'Пока неверно. ') + (VEC.same(x, -t.pair[0]) && VEC.same(y, -t.pair[1]) ? 'Похоже, вычли начало из конца наоборот: нужно «конец минус начало».' : 'Проверь знаки и порядок: сначала x, потом y.')); return; }
      } else {
        var v = VEC.parse($('a1').value);
        if (isNaN(v)) { fb('warn', 'Не получилось прочитать число. Пиши, например, 3,7 или −15 или 2√13.'); return; }
        ok = VEC.same(v, t.ans);
        $('a1').className = ok ? 'right' : 'wrong';
        if (!ok) { fb('no', 'Пока неверно.' + (VEC.same(v, -t.ans) ? ' Знак не тот.' : VEC.same(v * v, t.ans) ? ' Похоже, это квадрат ответа: не забудь извлечь корень.' : VEC.same(v, t.ans * t.ans) ? ' Похоже, ты не извлёк(ла) корень.' : '') + ' Нажми «Подсказка», если нужно.'); return; }
      }
      if (!t.counted && !t.shown) { S.solved[t.type] = (S.solved[t.type] || 0) + 1; t.counted = true; save(); }
      fb('ok', '<b>Верно!</b> ' + (t.shown ? '' : 'Нажми «Новая задача», чтобы закрепить.'));
    };
  }
  function fb(cls, html) { $('fb').innerHTML = '<div class="box ' + cls + '" style="margin-top:6px">' + html + '</div>'; }
  function newTask(part) {
    var types = Object.keys(VEC.GEN).filter(function (k) { return VEC.GEN[k].part === part; });
    var sel = S.types[part] || 'all', ty = sel === 'all' ? types[Math.floor(Math.random() * types.length)] : sel;
    var t = VEC.GEN[ty].make();
    t.type = ty; t.part = part;
    curTask = t;
  }
  function drawPic(pl) {
    var cols = { a: C.a, b: C.b, c: C.c };
    Object.keys(pl).forEach(function (k) {
      var v = pl[k], e = add(v.s, v.v);
      arrow(v.s, e, cols[k] || C.r, { label: k, side: 1, w: 2.8 });
    });
  }

  /* ---------- перетаскивание ручек ---------- */
  var drag = null;
  function svgXY(e) { var r = svg.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * W / r.height]; }
  function toP(xy) { return [Math.max(-9, Math.min(9, Math.round((xy[0] - O) / SC))), Math.max(-9, Math.min(9, Math.round((O - xy[1]) / SC)))]; }
  svg.addEventListener('pointerdown', function (e) {
    var xy = svgXY(e), best = null, bd = 18;
    handles.forEach(function (h) { var A = sp(h.p), d = Math.hypot(A[0] - xy[0], A[1] - xy[1]); if (d < bd) { bd = d; best = h; } });
    if (!best) return;
    drag = best.id; svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); e.preventDefault();
  });
  svg.addEventListener('pointermove', function (e) {
    var xy = svgXY(e);
    if (!drag) { svg.classList.toggle('grab', handles.some(function (h) { var A = sp(h.p); return Math.hypot(A[0] - xy[0], A[1] - xy[1]) < 18; })); return; }
    var id = S.topic[S.part], T = TOPICS[id], s = stOf(id), p = toP(xy);
    var before = JSON.stringify(s);
    T.drag(s, drag, p);
    if (JSON.stringify(s) !== before) render();
  });
  function endDrag() { drag = null; svg.classList.remove('dragging'); }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  var hs = (location.hash || '').slice(1);
  if (/^[123]$/.test(hs)) S.part = +hs;
  render();
})();
</script>
</body>
</html>
