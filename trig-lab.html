<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тригонометрическая лаборатория</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f7f9fb; --paper: #fff; --grid: #e6edf3; --ink: #17232d; --muted: #5d6d79; --line: #d5dee6; --faint: #c3ced7;
  --accent: #1f6f8b; --accent-soft: #e3f0f5;
  --sin: #d0532e; --cos: #1f63c9; --tg: #2f8a46; --ctg: #7a4fc4; --q: #c4880a;
  --ok: #2f7d4f; --ok-soft: #e4f3ea; --no: #b5452f; --no-soft: #fbe9e4; --sol: #e8590c; --sol-soft: #ffe8d9;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 60px; color: var(--ink); background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; font: 16px/1.55 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.2; }
.lead { margin: 0; color: var(--muted); max-width: 80ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 600 .95rem "Golos Text", sans-serif; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); cursor: pointer; }
.tab:hover, .tab:focus-visible { border-color: var(--accent); outline: none; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: clamp(14px, 3vw, 22px);
  display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .sheet { grid-template-columns: minmax(0, 1fr); } }
.colL, .colR { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
svg.fig { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
svg.fig:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.ctl > label, .ctl > span.lbl { font-size: .9rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { font: 600 .9rem "Golos Text", sans-serif; padding: 6px 11px; border: 0; border-right: 1px solid var(--line);
  background: var(--paper); color: var(--ink); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--accent-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg.fn button[data-v="sin"][aria-pressed="true"], .seg.fn button[data-v="arcsin"][aria-pressed="true"] { background: var(--sin); }
.seg.fn button[data-v="cos"][aria-pressed="true"], .seg.fn button[data-v="arccos"][aria-pressed="true"] { background: var(--cos); }
.seg.fn button[data-v="tg"][aria-pressed="true"], .seg.fn button[data-v="arctg"][aria-pressed="true"] { background: var(--tg); }
.seg.fn button[data-v="ctg"][aria-pressed="true"], .seg.fn button[data-v="arcctg"][aria-pressed="true"] { background: var(--ctg); }
select { font: 500 .9rem "Golos Text", sans-serif; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
input[type="checkbox"] { accent-color: var(--accent); }
.read { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: .98rem; }
.read .big { font-size: 1.12rem; font-weight: 600; }
.vals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 520px) { .vals { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.val { border-radius: 6px; padding: 6px 8px; background: var(--bg); border-left: 3px solid var(--line); }
.val b { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; }
.val.sin { border-color: var(--sin); } .val.cos { border-color: var(--cos); } .val.tg { border-color: var(--tg); } .val.ctg { border-color: var(--ctg); }
.val.on { background: var(--accent-soft); }
.chk { border-radius: 6px; padding: 8px 12px; }
.chk.ok { background: var(--ok-soft); border-left: 3px solid var(--ok); }
.chk.no { background: var(--no-soft); border-left: 3px solid var(--no); }
.chk.info { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.ans { background: var(--sol-soft); border-left: 3px solid var(--sol); border-radius: 6px; padding: 10px 14px; font-size: 1.05rem; }
.m { font-family: "Times New Roman", Times, serif; font-size: 1.12em; white-space: nowrap; }
.m i { font-style: italic; }
details { border-top: 1px dashed var(--line); padding-top: 8px; }
summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: .95rem; }
.try { margin: 8px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
/* чертежи */
.ax { stroke: var(--muted); stroke-width: 1.2; }
.gr { stroke: var(--grid); stroke-width: 1; }
.circ { stroke: var(--ink); stroke-width: 1.8; fill: none; }
.tk { font: 13px "Golos Text", sans-serif; fill: var(--muted); }
.tkm { font: italic 15px "Times New Roman", serif; fill: var(--muted); }
.lbl { font: italic 18px "Times New Roman", serif; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.dot { stroke: #fff; stroke-width: 1.5; }
.thin { stroke-width: 1.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.faint { stroke: var(--faint); stroke-width: 1.6; fill: none; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <h1>Тригонометрическая лаборатория</h1>
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="fn" aria-selected="true">Функции</button>
      <button class="tab" type="button" role="tab" data-tab="inv" aria-selected="false">Обратные функции</button>
      <button class="tab" type="button" role="tab" data-tab="eq" aria-selected="false">Уравнения и неравенства</button>
    </div>
    <p class="lead" id="lead"></p>
  </header>

  <section class="sheet">
    <div class="colL">
      <svg class="fig" id="circ" viewBox="0 0 400 400" tabindex="0" role="img" aria-label="Единичная окружность"></svg>
      <p class="hint" id="circHint"></p>
      <div class="ctl" id="circCtl"></div>
    </div>
    <div class="colR">
      <div class="ctl" id="ctl"></div>
      <svg class="fig" id="graph" viewBox="0 0 640 260" tabindex="0" role="img" aria-label="График"></svg>
      <div class="read" id="read"></div>
      <details id="tryBox">
        <summary>Что попробовать</summary>
        <ol class="try" id="try"></ol>
      </details>
    </div>
  </section>
</div>

<script>
/*LOGIC-START*/
var TRIG = (function () {
  var PI = Math.PI, EPS = 1e-9;
  var S3 = Math.sqrt(3);
  var SPECIAL = [[0, '0'], [0.5, '1/2'], [Math.SQRT2 / 2, '√2/2'], [S3 / 2, '√3/2'], [1, '1'], [S3 / 3, '√3/3'], [S3, '√3'], [2, '2'], [1.5, '1,5'], [0.25, '0,25']];
  /* «главные» значения a для обратных функций и уравнений */
  var A_SIN = [-1, -S3 / 2, -Math.SQRT2 / 2, -0.5, 0, 0.5, Math.SQRT2 / 2, S3 / 2, 1];
  var A_TG = [-S3, -1, -S3 / 3, 0, S3 / 3, 1, S3];

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function minus(s) { return String(s).replace(/-/g, '−'); }
  function exactNum(v) {
    for (var i = 0; i < SPECIAL.length; i++) if (Math.abs(Math.abs(v) - SPECIAL[i][0]) < 1e-9) return (v < -EPS ? '−' : '') + SPECIAL[i][1];
    return null;
  }
  function num(v) {
    var e = exactNum(v);
    if (e) return e;
    var r = Math.round(v * 1000) / 1000;
    return minus(String(r).replace('.', ','));
  }
  /* угол — кратный π/12 записываем через π */
  function piTxt(t) {
    var k = t / (PI / 12);
    if (Math.abs(k - Math.round(k)) > 1e-7) return null;
    k = Math.round(k);
    if (k === 0) return '0';
    var g = gcd(Math.abs(k), 12), p = k / g, q = 12 / g;
    return (p < 0 ? '−' : '') + (Math.abs(p) === 1 ? '' : Math.abs(p)) + 'π' + (q === 1 ? '' : '/' + q);
  }
  function ang(t) { return piTxt(t) || num(t); }
  function deg(t) { return minus(String(Math.round(t * 180 / PI * 10) / 10).replace('.', ',')) + '°'; }

  var F = {
    sin: function (x) { return Math.sin(x); },
    cos: function (x) { return Math.cos(x); },
    tg: function (x) { return Math.abs(Math.cos(x)) < 1e-9 ? NaN : Math.tan(x); },
    ctg: function (x) { return Math.abs(Math.sin(x)) < 1e-9 ? NaN : Math.cos(x) / Math.sin(x); }
  };
  var INV = {
    arcsin: { base: 'sin', f: Math.asin, dom: [-1, 1], rng: [-PI / 2, PI / 2], closed: true, A: A_SIN },
    arccos: { base: 'cos', f: Math.acos, dom: [-1, 1], rng: [0, PI], closed: true, A: A_SIN },
    arctg: { base: 'tg', f: Math.atan, dom: [-Infinity, Infinity], rng: [-PI / 2, PI / 2], closed: false, A: A_TG },
    arcctg: { base: 'ctg', f: function (a) { return PI / 2 - Math.atan(a); }, dom: [-Infinity, Infinity], rng: [0, PI], closed: false, A: A_TG }
  };
  function val(fn, t) {
    var v = F[fn](t);
    return isNaN(v) ? 'не существует' : num(v);
  }

  /* вторая точка: F(партнёр) = знак · G(t) */
  var PARTNERS = {
    'neg': { lab: '−t', f: function (t) { return -t; }, rel: { sin: [-1, 'sin'], cos: [1, 'cos'], tg: [-1, 'tg'], ctg: [-1, 'ctg'] },
      why: { sin: 'синус нечётный', cos: 'косинус чётный', tg: 'тангенс нечётный', ctg: 'котангенс нечётный' }, sym: 'Ox' },
    'pi-t': { lab: 'π − t', f: function (t) { return PI - t; }, rel: { sin: [1, 'sin'], cos: [-1, 'cos'], tg: [-1, 'tg'], ctg: [-1, 'ctg'] }, sym: 'Oy' },
    'pi+t': { lab: 'π + t', f: function (t) { return PI + t; }, rel: { sin: [-1, 'sin'], cos: [-1, 'cos'], tg: [1, 'tg'], ctg: [1, 'ctg'] }, sym: 'O' },
    'pi2-t': { lab: 'π/2 − t', f: function (t) { return PI / 2 - t; }, rel: { sin: [1, 'cos'], cos: [1, 'sin'], tg: [1, 'ctg'], ctg: [1, 'tg'] }, sym: 'y=x' },
    'pi2+t': { lab: 'π/2 + t', f: function (t) { return PI / 2 + t; }, rel: { sin: [1, 'cos'], cos: [-1, 'sin'], tg: [-1, 'ctg'], ctg: [-1, 'tg'] }, sym: 'rot' },
    '2pi': { lab: 't + 2π', f: function (t) { return t + 2 * PI; }, rel: { sin: [1, 'sin'], cos: [1, 'cos'], tg: [1, 'tg'], ctg: [1, 'ctg'] }, sym: 'same' },
    'pi': { lab: 't + π', f: function (t) { return t + PI; }, rel: { tg: [1, 'tg'], ctg: [1, 'ctg'], sin: [-1, 'sin'], cos: [-1, 'cos'] }, sym: 'O' }
  };
  /* проверка свойства: {lhs, rhs, ok, text} */
  function partnerCheck(fn, key, t) {
    var P = PARTNERS[key], r = P.rel[fn], u = P.f(t);
    var L = F[fn](u), Rv = F[r[1]](t) * r[0];
    var lhsName = fn + '(' + P.lab + ')', rhsName = (r[0] < 0 ? '−' : '') + r[1] + ' t';
    var ex = !isNaN(L), ex2 = !isNaN(Rv);
    var ok = (!ex && !ex2) || (ex && ex2 && Math.abs(L - Rv) < 1e-9);
    return { lhs: lhsName, rhs: rhsName, L: ex ? num(L) : 'не существует', R: ex2 ? num(Rv) : 'не существует', ok: ok, both: ex && ex2 };
  }

  /* ---------- уравнения и неравенства ----------
     возвращает {none|all|series:[…], intervals:[…]} и текст ответа */
  function arcTerm(inv, a) {
    var v = INV[inv].f(a), p = piTxt(v);
    return { v: v, exact: p !== null, txt: p !== null ? p : inv + ' ' + num(a) };
  }
  /* c·π + s·arc */
  function comb(c, s, A) {
    var v = c * PI + s * A.v;
    if (A.exact) return { v: v, txt: piTxt(v) };
    var head = c === 0 ? '' : (c === 1 ? 'π' : c === -1 ? '−π' : minus(c) + 'π');
    var t = head + (s < 0 ? (head ? ' − ' : '−') : (head ? ' + ' : '')) + A.txt;
    return { v: v, txt: t };
  }
  function series(x, step) { return x.txt === '0' ? (step === 1 ? 'πn' : '2πn') : x.txt + ' + ' + (step === 1 ? 'πn' : '2πn'); }
  function solve(fn, sign, a) {
    var strict = sign === '>' || sign === '<', gt = sign === '>' || sign === '≥';
    var res = { fn: fn, sign: sign, a: a };
    var lo, hi, A;
    if (fn === 'sin' || fn === 'cos') {
      if (sign === '=') {
        if (Math.abs(a) > 1 + EPS) return done(res, 'Решений нет: ' + fn + ' x принимает значения только от −1 до 1.');
        if (fn === 'sin') {
          if (Math.abs(a - 1) < EPS) return done(res, 'x = π/2 + 2πn', [[PI / 2, 2]]);
          if (Math.abs(a + 1) < EPS) return done(res, 'x = −π/2 + 2πn', [[-PI / 2, 2]]);
          if (Math.abs(a) < EPS) return done(res, 'x = πn', [[0, 1]]);
          A = arcTerm('arcsin', a);
          var s2 = comb(1, -1, A);
          return done(res, 'x = ' + series(A, 2) + ',  x = ' + series(s2, 2), [[A.v, 2], [s2.v, 2]]);
        }
        if (Math.abs(a - 1) < EPS) return done(res, 'x = 2πn', [[0, 2]]);
        if (Math.abs(a + 1) < EPS) return done(res, 'x = π + 2πn', [[PI, 2]]);
        if (Math.abs(a) < EPS) return done(res, 'x = π/2 + πn', [[PI / 2, 1]]);
        A = arcTerm('arccos', a);
        return done(res, 'x = ±' + (A.exact ? A.txt : A.txt) + ' + 2πn', [[A.v, 2], [-A.v, 2]]);
      }
      /* неравенства: крайние случаи */
      var top = 1, bot = -1;
      if (gt) {
        if (a > top + EPS || (strict && a >= top - EPS)) return done(res, 'Решений нет: ' + fn + ' x не бывает больше 1.', null, []);
        if (a < bot - EPS || (!strict && a <= bot + EPS)) return done(res, 'x — любое число.', null, 'all');
        if (strict && a <= bot + EPS) return done(res, fn === 'sin' ? 'x ≠ −π/2 + 2πn' : 'x ≠ π + 2πn', null, 'allbut');
        if (!strict && a >= top - EPS) return done(res, fn === 'sin' ? 'x = π/2 + 2πn' : 'x = 2πn', fn === 'sin' ? [[PI / 2, 2]] : [[0, 2]]);
      } else {
        if (a < bot - EPS || (strict && a <= bot + EPS)) return done(res, 'Решений нет: ' + fn + ' x не бывает меньше −1.', null, []);
        if (a > top + EPS || (!strict && a >= top - EPS)) return done(res, 'x — любое число.', null, 'all');
        if (strict && a >= top - EPS) return done(res, fn === 'sin' ? 'x ≠ π/2 + 2πn' : 'x ≠ 2πn', null, 'allbut');
        if (!strict && a <= bot + EPS) return done(res, fn === 'sin' ? 'x = −π/2 + 2πn' : 'x = π + 2πn', fn === 'sin' ? [[-PI / 2, 2]] : [[PI, 2]]);
      }
      if (fn === 'sin') {
        A = arcTerm('arcsin', a);
        if (gt) { lo = A; hi = comb(1, -1, A); } else { lo = comb(-1, -1, A); hi = A; }
      } else {
        A = arcTerm('arccos', a);
        if (gt) { lo = comb(0, -1, A); hi = A; } else { lo = A; hi = comb(2, -1, A); }
      }
      return interval(res, lo, hi, strict, strict, 2);
    }
    /* tg, ctg: значения — все числа */
    var inv = fn === 'tg' ? 'arctg' : 'arcctg';
    A = arcTerm(inv, a);
    if (sign === '=') return done(res, 'x = ' + series(A, 1), [[A.v, 1]]);
    var asL = fn === 'tg' ? { v: -PI / 2, txt: '−π/2' } : { v: 0, txt: '0' };
    var asR = fn === 'tg' ? { v: PI / 2, txt: 'π/2' } : { v: PI, txt: 'π' };
    var incr = fn === 'tg';
    if (gt === incr) return interval(res, A, asR, strict, true, 1);
    return interval(res, asL, A, true, strict, 1);
  }
  function done(res, text, pts, special) {
    res.text = text; res.pts = pts || null; res.special = special || null;
    return res;
  }
  function interval(res, lo, hi, openL, openR, step) {
    var per = step === 1 ? 'πn' : '2πn';
    var L = lo.txt === '0' ? per : lo.txt + ' + ' + per, R = hi.txt === '0' ? per : hi.txt + ' + ' + per;
    res.text = 'x ∈ ' + (openL ? '(' : '[') + L + ';  ' + R + (openR ? ')' : ']') + ',';
    res.iv = { lo: lo.v, hi: hi.v, openL: openL, openR: openR, per: step === 1 ? PI : 2 * PI };
    return res;
  }
  /* выполнено ли условие в точке x (для проверки и рисования) */
  function holds(fn, sign, a, x) {
    var v = F[fn](x);
    if (isNaN(v)) return false;
    if (sign === '=') return Math.abs(v - a) < 1e-9;
    if (sign === '>') return v > a + 1e-12;
    if (sign === '<') return v < a - 1e-12;
    if (sign === '≥') return v >= a - 1e-12;
    return v <= a + 1e-12;
  }

  return { PI: PI, F: F, INV: INV, PARTNERS: PARTNERS, A_SIN: A_SIN, A_TG: A_TG, num: num, ang: ang, deg: deg, piTxt: piTxt,
    val: val, partnerCheck: partnerCheck, solve: solve, holds: holds, exactNum: exactNum, minus: minus };
})();
/*LOGIC-END*/

(function () {
  var T = TRIG, PI = Math.PI, NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var circ = $('circ'), graph = $('graph');
  var COL = { sin: 'var(--sin)', cos: 'var(--cos)', tg: 'var(--tg)', ctg: 'var(--ctg)' };

  var S = {
    tab: 'fn',
    fn: 'sin', t: PI / 6, snap: 'special', partner: 'none', showAll: false, labels: true,
    inv: 'arcsin', a: 0.5, prop: 'none', x: 2.4, asnap: 'special',
    efn: 'sin', sign: '>', ea: 0.5
  };
  try { var saved = JSON.parse(localStorage.getItem('trig-lab') || 'null'); if (saved) for (var k in saved) if (k in S) S[k] = saved[k]; } catch (e) {}
  if (typeof S.a !== 'number') S.a = 0.5;
  function save() { try { localStorage.setItem('trig-lab', JSON.stringify(S)); } catch (e) {} }

  /* ---------- SVG ---------- */
  function el(tag, at, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e);
    return e;
  }
  function clear(s) { while (s.firstChild) s.removeChild(s.firstChild); }

  /* окружность: центр (200,200), радиус 130 */
  var CX = 200, CY = 200, R = 130;
  function cp(x, y) { return [CX + x * R, CY - y * R]; }
  function cline(x1, y1, x2, y2, at, g) {
    var a = cp(x1, y1), b = cp(x2, y2);
    at = at || {};
    at.x1 = a[0].toFixed(1); at.y1 = a[1].toFixed(1); at.x2 = b[0].toFixed(1); at.y2 = b[1].toFixed(1);
    return el('line', at, g || circ);
  }
  function cdot(x, y, color, r, hollow) {
    var p = cp(x, y);
    return el('circle', { cx: p[0], cy: p[1], r: r || 6, fill: hollow ? '#fff' : color, stroke: hollow ? color : '#fff', 'stroke-width': hollow ? 2.4 : 1.5 }, circ);
  }
  function ctext(x, y, txt, cls, color, anchor) {
    var p = cp(x, y);
    var t = el('text', { x: p[0], y: p[1], 'class': cls || 'lbl', 'text-anchor': anchor || 'middle' }, circ, txt);
    if (color) t.setAttribute('fill', color);
    return t;
  }
  /* дуга окружности радиуса r (в долях единицы) от угла a до b против часовой стрелки */
  function arcPath(r, a, b) {
    var n = Math.max(8, Math.ceil(Math.abs(b - a) / 0.05)), d = '';
    for (var i = 0; i <= n; i++) {

    if (sign !== '=') for (i = 0; i < M2; i++) {
      var xa = x0 + (x1 - x0) * (i + 0.5) / M2, h0 = T.holds(fn, sign === '≥' ? '>' : sign === '≤' ? '<' : sign, a, xa);
      if (h0) { if (!cr) { cr = { a: x0 + (x1 - x0) * i / M2, b: 0 }; gr.push(cr); } cr.b = x0 + (x1 - x0) * (i + 1) / M2; } else cr = null;
    }
    gr.forEach(function (r) {
      var p = gp(r.a, 0), q = gp(r.b, 0);
      var rc = el('rect', { x: p[0], y: 0, width: Math.max(0, q[0] - p[0]), height: G.H, fill: 'var(--sol-soft)' }, graph);
      graph.insertBefore(rc, graph.firstChild);
    });
    gr.forEach(function (r) { gline(r.a, 0, r.b, 0, { stroke: 'var(--sol)', 'stroke-width': 5, 'stroke-opacity': 0.85 }); });
    plot(T.F[fn], G.x0, G.x1, { stroke: col, 'stroke-width': 2.4 });
    if (sign !== '=') plot(function (x) { return T.holds(fn, sign === '≥' ? '>' : sign === '≤' ? '<' : sign, a, x) ? T.F[fn](x) : NaN; }, x0, x1, { stroke: 'var(--sol)', 'stroke-width': 4 });
    gline(G.x0, clamp(a, G.y0, G.y1), G.x1, clamp(a, G.y0, G.y1), { stroke: col, 'stroke-width': 1.6, 'class': 'dash' });
    gtext(G.x0 + 0.1, clamp(a, G.y0, G.y1), 'y = ' + T.num(a), 'tk', col, 'start', a < 0 ? 17 : -6);
    /* точки решений и концы на графике в пределах [−2π; 2π] */
    ends.forEach(function (e) {
      var per = res.pts ? (res.pts.some(function (p) { return p[1] === 1; }) ? PI : 2 * PI) : (res.iv ? res.iv.per : 2 * PI);
      for (var k = -4; k <= 4; k++) {
        var xx = e.v + k * per;
        if (xx < x0 - 1e-9 || xx > x1 + 1e-9) continue;
        var yy = T.F[fn](xx);
        if (!isFinite(yy)) continue;
        gdot(xx, yy, 'var(--sol)', 5.5, e.open);
        gdot(xx, 0, 'var(--sol)', 4.5, e.open);
      }
    });
    var h = '<div class="big">' + M(fn + ' <i>x</i> ' + sign + ' ' + T.num(a)) + '</div>';
    h += '<div class="ans"><b>Ответ:</b> ' + M(res.text.replace(/\bx\b/g, '<i>x</i>').replace(/n/g, '<i>n</i>')) + (/n/.test(res.text) ? ' &nbsp;' + M('<i>n</i> ∈ ℤ') : '') + '</div>';
    h += '<div class="chk info">' + eqWhy(fn, sign, a, res) + '</div>';
    $('read').innerHTML = h;
    setTry([
      'Реши sin x = 1/2: найди обе точки на окружности. Как получить из первой точки вторую?',
      'Сравни ответы для sin x = 0, sin x = 1 и sin x = 1/2. Почему для 0 и 1 пишут одну серию, а не две?',
      'Переключи знак с > на ≥. Что меняется на окружности и в ответе?',
      'Сделай a больше 1 для sin x > a и sin x < a. Почему в одном случае решений нет, а в другом подходит любое x?',
      'Для неравенства cos x < 1/2 дуга проходит через точку π. Почему левый конец промежутка π/3, а правый 5π/3, а не −π/3?',
      'Реши tg x ≥ 1. Почему правый конец промежутка всегда с круглой скобкой?'
    ]);
  }
  function eqWhy(fn, sign, a, res) {
    if (res.special === 'all' || (res.text.indexOf('нет') >= 0)) return 'Посмотри на окружность: прямая ' + M((fn === 'cos' ? '<i>x</i>' : '<i>y</i>') + ' = ' + T.num(a)) + ' не пересекает окружность.';
    if (sign === '=') {
      if (fn === 'sin') return 'Ищем точки окружности на высоте ' + M(T.num(a)) + ': их ординаты равны ' + M('<i>a</i>') + '. Каждая точка даёт серию углов через полный оборот 2π.';
      if (fn === 'cos') return 'Ищем точки окружности с абсциссой ' + M(T.num(a)) + '. Они симметричны относительно оси ' + M('<i>Ox</i>') + ', поэтому ответ записывают со знаком ±.';
      return 'Прямая через центр и точку на оси ' + fn + ' пересекает окружность в двух противоположных точках. Они отличаются на π, поэтому одна серия с шагом π.';
    }
    if (fn === 'sin' || fn === 'cos') return 'Обходим выделенную дугу против часовой стрелки: левый конец промежутка — где дуга начинается, правый — где кончается. Поэтому левый конец всегда меньше правого. Закрашенная точка входит в ответ, пустая нет.';
    return 'Период ' + fn + ' равен π, поэтому достаточно найти решения на одном промежутке длиной π и добавить πn. Точки, где ' + fn + ' не существует, в ответ не входят.';
  }

  function setTry(list) {
    var ol = $('try');
    ol.innerHTML = '';
    list.forEach(function (s) { var li = document.createElement('li'); li.textContent = s; ol.appendChild(li); });
  }

  /* ---------- общая отрисовка ---------- */
  var LEADS = {
    fn: 'Угол t откладывается на единичной окружности. Синус — ордината точки, косинус — абсцисса, тангенс и котангенс читаются на своих осях. Справа тот же угол на графике.',
    inv: 'Арк-функция по значению a находит угол. Таких углов бесконечно много, поэтому берут один, из промежутка главных значений: он выделен на окружности. Справа видно, что график обратной функции симметричен куску исходного графика относительно прямой y = x.',
    eq: 'Уравнение и неравенство решаются одной картинкой: на окружности отмечаем точки или дугу, на графике — промежутки оси x. Ответ записан сериями с n ∈ ℤ.'
  };
  function drawAll() {
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === S.tab ? 'true' : 'false'); });
    $('lead').textContent = LEADS[S.tab];
    if (S.tab === 'fn') { fnControls(); drawFn(); }
    else if (S.tab === 'inv') { invControls(); drawInv(); }
    else { eqControls(); drawEq(); }
    save();
  }
  function redraw() {
    if (S.tab === 'fn') drawFn(); else if (S.tab === 'inv') drawInv(); else drawEq();
    save();
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { S.tab = b.dataset.tab; drawAll(); }; });

  /* ---------- перетаскивание ---------- */
  function svgPt(svg, e) {
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    return [(e.clientX - r.left) * vb.width / r.width, (e.clientY - r.top) * vb.height / r.height];
  }
  function onCircle(e) {
    var p = svgPt(circ, e), x = (p[0] - CX) / R, y = (CY - p[1]) / R, th = Math.atan2(y, x);
    if (S.tab === 'fn' || (S.tab === 'inv' && S.prop === 'comp')) {
      var key = S.tab === 'fn' ? 't' : 'x';
      S[key] = clamp(snapAngle(unwrap(th, S[key])), -2 * PI, 2 * PI);
    } else if (S.tab === 'inv') {
      var I = T.INV[S.inv], a;
      if (S.inv === 'arcsin') a = y; else if (S.inv === 'arccos') a = x;
      else if (S.inv === 'arctg') th = clamp(x < 0 ? (y > 0 ? PI / 2 : -PI / 2) : th, -PI / 2, PI / 2);
      else th = clamp(y < 0 ? (x > 0 ? 0 : PI) : th, 0, PI);
      if (S.inv === 'arctg' || S.inv === 'arcctg') S.a = angToA(S.inv, snapTh(th));
      else S.a = clamp(snapA(a, I.A), I.dom[0], I.dom[1]);
    } else {
      var fn = S.efn, b;
      if (fn === 'sin') b = y; else if (fn === 'cos') b = x;
      else if (fn === 'tg') b = Math.abs(Math.cos(th)) < 0.03 ? Math.sign(Math.sin(th)) * 30 : Math.tan(th);
      else b = Math.abs(Math.sin(th)) < 0.03 ? Math.sign(Math.cos(th)) * 30 : 1 / Math.tan(th);
      S.ea = clamp(snapA(b, fn === 'sin' || fn === 'cos' ? T.A_SIN.concat([-1.5, 1.5]) : T.A_TG), -2.2, 2.2);
    }
    redraw();
  }
  function onGraph(e) {
    var p = svgPt(graph, e), x = p[0] / G.sc + G.x0, y = G.y1 - p[1] / G.sc;
    if (S.tab === 'fn') S.t = clamp(snapAngle(x), -2 * PI, 2 * PI);
    else if (S.tab === 'inv') {
      if (S.prop === 'comp') S.x = clamp(snapAngle(x), -2 * PI, 2 * PI);
      else { var I = T.INV[S.inv]; S.a = clamp(snapA(x, I.A), I.dom[0], I.dom[1]); }
    } else S.ea = clamp(snapA(y, S.efn === 'sin' || S.efn === 'cos' ? T.A_SIN.concat([-1.5, 1.5]) : T.A_TG), -2.2, 2.2);
    redraw();
  }
  [[circ, onCircle], [graph, onGraph]].forEach(function (pr) {
    var svg = pr[0], fnc = pr[1], down = false;
    svg.addEventListener('pointerdown', function (e) { down = true; svg.setPointerCapture(e.pointerId); fnc(e); e.preventDefault(); });
    svg.addEventListener('pointermove', function (e) { if (down) fnc(e); });
    svg.addEventListener('pointerup', function () { down = false; });
    svg.addEventListener('pointercancel', function () { down = false; });
    svg.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      if (S.tab === 'fn' || (S.tab === 'inv' && S.prop === 'comp')) {
        var key = S.tab === 'fn' ? 't' : 'x';
        S[key] = clamp(S[key] + d * PI / 12, -2 * PI, 2 * PI);
      } else if (S.tab === 'inv' && (S.inv === 'arctg' || S.inv === 'arcctg')) {
        var Ik = T.INV[S.inv], th0 = Math.round(Ik.f(S.a) / (PI / 12)) * PI / 12;
        S.a = angToA(S.inv, clamp(th0 + d * PI / 12, Ik.rng[0], Ik.rng[1]));
      } else if (S.tab === 'inv') {
        var I = T.INV[S.inv], list = I.A, j = nearestIdx(list, S.a);
        S.a = list[clamp(j + d, 0, list.length - 1)];
      } else {
        var L = S.efn === 'sin' || S.efn === 'cos' ? T.A_SIN : T.A_TG, j2 = nearestIdx(L, S.ea);
        S.ea = L[clamp(j2 + d, 0, L.length - 1)];
      }
      redraw();
    });
  });
  /* угол на окружности → a для arctg/arcctg; на границе (90° или 0°/180°) значение не определено: ±∞ */
  function angToA(inv, th) {
    if (inv === 'arctg') {
      if (Math.abs(th - PI / 2) < 1e-9) return Infinity;
      if (Math.abs(th + PI / 2) < 1e-9) return -Infinity;
      var v = Math.tan(th);
      return Math.abs(v) < 5 && S.asnap !== 'free' ? snapA(v, T.A_TG) : v;
    }
    if (Math.abs(th) < 1e-9) return Infinity;
    if (Math.abs(th - PI) < 1e-9) return -Infinity;
    var w = 1 / Math.tan(th);
    return Math.abs(w) < 5 && S.asnap !== 'free' ? snapA(w, T.A_TG) : w;
  }
  /* табличные углы прилипают, остальные — с шагом 1°; у самой границы угол встаёт на неё */
  function snapTh(th) {
    var D = PI / 180;
    if (S.asnap === 'free') {
      [-PI / 2, 0, PI / 2, PI].forEach(function (b) { if (Math.abs(th - b) < 0.3 * D) th = b; });
      return th;
    }
    if (S.asnap === 'special') {
      for (var k = -6; k <= 12; k++) if ((k % 2 === 0 || k % 3 === 0) && Math.abs(th - k * PI / 12) < 3.5 * D) return k * PI / 12;
    }
    return Math.round(th / D) * D;
  }
  function nearestIdx(list, v) {
    var j = 0;
    list.forEach(function (x, i) { if (Math.abs(x - v) < Math.abs(list[j] - v)) j = i; });
    return j;
  }

  var hash = (location.hash || '').slice(1);
  if (hash === 'fn' || hash === 'inv' || hash === 'eq') S.tab = hash;
  drawAll();
})();
</script>
</body>
</html>
